<section id="native-view" class="device-workspace" hidden>
 <div class="workspace-heading"><div><span class="eyebrow">DEVICE CONTROLS</span><h2><span class="lang-fa">تمام تنظیمات دستگاه</span><span class="lang-en">Device settings</span></h2></div><input id="settings-search" type="search" placeholder="جست‌وجوی تنظیمات / Search settings" aria-label="جست‌وجوی تنظیمات"></div>
 <div class="settings-layout"><nav id="settings-menu" class="settings-menu" aria-label="تنظیمات دستگاه"></nav>
  <article class="card settings-card"><div class="card-top"><h2 id="settings-heading"></h2><button class="secondary" id="settings-reload"><span class="lang-fa">بازخوانی</span><span class="lang-en">Reload</span></button></div>
   <p id="settings-status" role="status" class="muted"></p><div id="settings-surface" class="settings-surface"></div>
  </article></div>
</section>
<dialog id="settings-dialog" class="settings-dialog"><form method="dialog"><h2>Tehran Network</h2><p id="settings-dialog-message"></p><div class="system-actions"><button value="cancel" class="secondary">انصراف / Cancel</button><button value="ok" class="primary">تأیید / Confirm</button></div></form></dialog>
